[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "arcana-reference"
version = "0.1.0"
description = "Public reference implementation scaffold for ARCANA autonomy accounting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending public release review" }
authors = [
  { name = "ARCANA Public Reference Maintainers" }
]
dependencies = [
  "jsonschema>=4.22,<5",
  "numpy>=1.26,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
arcana-demo = "arcana.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-config",
  "--strict-markers"
]

[tool.hatch.build.targets.wheel]
packages = ["src/arcana"]
